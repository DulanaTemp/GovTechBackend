spring.application.name=GovTechBackend

# Server port (Railway/most PaaS inject PORT; default to 8080 locally)
server.port=${PORT:8080}

# Datasource (override via environment variables in each environment)
# NOTE: These defaults point at a live Railway database. Do not commit real
# credentials to source control in production; inject them via env vars instead.
spring.datasource.url=${DB_URL:jdbc:postgresql://sakura.proxy.rlwy.net:30580/railway}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:BFCwnfjPDFocwSVErqnDnxARTejbuRJP}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Hibernate creates/updates the schema from the entity mappings, including the
# native PostgreSQL enum types (mapped via @JdbcTypeCode(NAMED_ENUM)).
# For a controlled production rollout, switch this to 'validate' and apply the
# canonical DDL (see schema.sql) as a migration instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# SQL schema initialization disabled: Hibernate owns schema creation above.
spring.sql.init.mode=never

# JWT (MUST be overridden with a strong secret in production; min 32 bytes for HS256)
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes-long}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# OTP
app.otp.length=${OTP_LENGTH:6}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
# When true, the generated OTP is logged for local testing. MUST be false in production.
app.otp.log-for-development=${OTP_LOG_FOR_DEV:true}
# DEV/DEMO ONLY: when true, any 6-digit code is accepted at verify time without
# checking the generated OTP. MUST be false in production.
app.otp.bypass-validation=${OTP_BYPASS_VALIDATION:true}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
