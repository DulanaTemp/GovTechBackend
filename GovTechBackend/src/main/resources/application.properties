spring.application.name=GovTechBackend

# Datasource (override via environment variables in each environment)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/govtech_parking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# The schema is managed by SQL DDL, so Hibernate should not modify it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (MUST be overridden with a strong secret in production; min 32 bytes for HS256)
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes-long}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# OTP
app.otp.length=${OTP_LENGTH:6}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
# When true, the generated OTP is logged for local testing. MUST be false in production.
app.otp.log-for-development=${OTP_LOG_FOR_DEV:true}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
